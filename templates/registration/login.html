{% extends "base.html" %}

{% block title %}CookWise - Log in{% endblock %}

{% block content %}
    <div class="form-box">
        <h2>Log in</h2>
        <form method="post">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="button">Log in</button>
        </form>
        <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
{% endblock %}
