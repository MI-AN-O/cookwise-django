{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CookWise{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1><img src="{% static 'images/logo.svg' %}" alt="" width="50" height="50"> CookWise</h1>
        <nav>
            <ul>
                <li><a href="{% url 'recipes:home' %}">Home</a></li>
                <li><a href="{% url 'recipes:recipe_list' %}">All recipes</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; {% now "Y" %} <img src="{% static 'images/logo.svg' %}" alt="" width="16" height="16"> COOKWISE. All rights reserved.</p>
    </footer>
</body>
</html>
