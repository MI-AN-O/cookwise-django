{% extends "base.html" %}
{% load static %}

{% block title %}CookWise - Home{% endblock %}

{% block content %}
    {% for category in categories %}
        <section class="category" style="background-image: url('{% static 'images/' %}{{ category.image }}');">
            <h2><a href="{{ category.get_absolute_url }}">{{ category.name }}</a></h2>
            <p>{{ category.tagline }}</p>
        </section>
    {% empty %}
        <p>No categories yet.</p>
    {% endfor %}
{% endblock %}
