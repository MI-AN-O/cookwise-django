{% extends "base.html" %}

{% block title %}CookWise - Delete {{ recipe.title }}{% endblock %}

{% block content %}
    <div class="form-box">
        <h2>Delete “{{ recipe.title }}”?</h2>
        <p>This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button danger">Yes, delete it</button>
            <a href="{{ recipe.get_absolute_url }}">Cancel</a>
        </form>
    </div>
{% endblock %}
